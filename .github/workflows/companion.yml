# Builds the companion on GitHub's machines (PyInstaller only builds for the system it runs on):
# Windows .exe, macOS .app for Apple Silicon and Intel. Run it from the Actions tab (Run workflow),
# or push a tag companion-v0.1.0 to also publish the files in a GitHub Release.
# Public builds only: never put the guild's connection code here (build_private.py stays local).
name: companion

on:
  workflow_dispatch:
  push:
    tags: ["companion-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, arch: x64, file: "companion/dist/WallOfShameCompanion.exe" }
          - { name: mac-arm64, os: macos-14, arch: arm64, file: "companion/dist/WallOfShameCompanion-mac-arm64.zip" }
          # Intel Macs: x86_64 Python under Rosetta on the same Apple Silicon machine
          - { name: mac-x86_64, os: macos-14, arch: x64, file: "companion/dist/WallOfShameCompanion-mac-x86_64.zip" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Wall of Shame Forever companion ${{ github.ref_name }}
          files: artifacts/*
          body: |
            Companion program for the Wall of Shame Forever addon (optional, for Discord).
            - Windows: WallOfShameCompanion.exe
            - macOS Apple Silicon (M1 and later): WallOfShameCompanion-mac-arm64.zip
            - macOS Intel: WallOfShameCompanion-mac-x86_64.zip
            Not signed: Windows shows "Windows protected your PC" (More info > Run anyway); macOS asks
            to confirm in System Settings > Privacy & Security (Open Anyway). See companion/README.md.
